<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Salles')}"></head><body>
<header th:replace="~{fragments/layout :: navigation}"></header>
<main class="container"><div class="page-title"><div><div class="eyebrow">RESSOURCES</div><h1>Salles de réunion</h1><p class="text-secondary">Capacité, emplacement, état et responsable.</p></div><a class="btn btn-dark" th:href="@{/salles/nouvelle}">+ Ajouter une salle</a></div>
<div class="row g-3"><div class="col-md-6 col-xl-4" th:each="s:${salles}"><article class="panel h-100"><div class="d-flex justify-content-between align-items-start gap-2"><h2 class="h4" th:text="${s.nom}"></h2><span class="pill" th:text="${s.statut}"></span></div>
<div class="mb-2 text-secondary" th:text="${s.localisation}"></div><p class="mb-2"><strong th:text="${s.capacite}"></strong> places · <span th:text="${s.responsable==null?'Sans responsable':s.responsable.nom}"></span></p>
<div class="mt-3 d-flex flex-wrap gap-2"><a class="btn btn-sm btn-outline-dark" th:href="@{/salles/{id}/modifier(id=${s.id})}">Modifier</a><a class="btn btn-sm btn-dark" th:href="@{/reservations/nouvelle(salleId=${s.id})}">Réserver</a></div></article></div></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
