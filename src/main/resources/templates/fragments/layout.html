<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <title th:text="${pageTitle} + ' · SallePilot'">SallePilot</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="navigation" class="site-header mb-4">
 <nav class="navbar navbar-expand-lg container gap-2">
  <a class="navbar-brand fw-bold" th:href="@{/}">▦ SallePilot</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNav" aria-label="Ouvrir le menu"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="appNav"><div class="navbar-nav ms-auto gap-lg-1">
   <a class="nav-link" th:href="@{/}">Accueil</a><a class="nav-link" th:href="@{/salles}">Salles</a>
   <a class="nav-link" th:href="@{/reservations}">Réservations</a>
   <a class="nav-link" th:href="@{/disponibilites}">Disponibilités</a>
   <a class="nav-link" th:href="@{/calendrier}">Calendrier</a>
   <a class="nav-link" th:href="@{/statistiques}">Statistiques</a>
   <a class="nav-link" th:href="@{/employes}">Employés</a>
   <a class="nav-link" th:href="@{/responsables}">Responsables</a>
  </div></div>
 </nav>
</header>
<div th:fragment="flash" class="container">
 <div th:if="${succes}" class="alert alert-success" role="status" th:text="${succes}"></div>
 <div th:if="${erreur}" class="alert alert-danger" role="alert" th:text="${erreur}"></div>
</div>
<footer th:fragment="footer" class="container small text-muted pt-4 pb-5">
 <hr><div class="d-flex flex-wrap justify-content-between gap-2"><span>Projet 4 · Gestionnaire de réservation de salles</span><span>Spring Boot 3 · Thymeleaf · Bootstrap</span></div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body></html>
