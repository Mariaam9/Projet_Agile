<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Réserver une salle')}"></head><body>
<header th:replace="~{fragments/layout :: navigation}"></header>
<main class="container narrow"><a class="simple-link" th:href="@{/reservations}">← Retour aux réservations</a><h1 class="mt-3 mb-2" th:text="${titre}"></h1>
<p class="text-secondary">La demande est automatiquement confirmée si les horaires sont libres et la capacité respectée.</p><section class="panel">
<form method="post" th:object="${reservationForm}" th:action="${id==null} ? @{/reservations} : @{/reservations/{id}/modifier(id=${id})}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><div th:each="e:${#fields.allErrors()}" th:text="${e}"></div></div>
<div class="row g-3"><div class="col-md-6"><label class="form-label" for="employe">Employé</label>
<select class="form-select" id="employe" th:field="*{employeId}" th:disabled="${id!=null}" required><option value="">Choisir...</option><option th:each="e:${employes}" th:value="${e.id}" th:text="${e.nom}"></option></select>
<input type="hidden" th:if="${id!=null}" th:field="*{employeId}"></div>
<div class="col-md-6"><label class="form-label" for="salle">Salle</label><select class="form-select" id="salle" th:field="*{salleId}" required><option value="">Choisir...</option><option th:each="s:${salles}" th:value="${s.id}" th:text="|${s.nom} · ${s.capacite} places (${s.statut})|"></option></select></div>
<div class="col-md-6"><label class="form-label" for="debut">Date et heure de début</label><input class="form-control" type="datetime-local" id="debut" th:field="*{dateDebut}" required></div>
<div class="col-md-6"><label class="form-label" for="fin">Date et heure de fin</label><input class="form-control" type="datetime-local" id="fin" th:field="*{dateFin}" required></div>
<div class="col-md-8"><label class="form-label" for="motif">Motif</label><input class="form-control" id="motif" maxlength="300" th:field="*{motif}" placeholder="Réunion de projet" required></div>
<div class="col-md-4"><label class="form-label" for="participants">Participants</label><input class="form-control" type="number" min="1" id="participants" th:field="*{nombreParticipants}" required></div></div>
<div class="d-flex gap-2 mt-4"><button class="btn btn-dark" type="submit">Enregistrer la réservation</button><a class="btn btn-outline-secondary" th:href="@{/disponibilites}">Chercher une salle disponible</a></div>
</form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
